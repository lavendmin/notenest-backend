# 로컬 Docker MariaDB (docker-compose.yml) — 로컬 전용 값이므로 커밋 대상
spring.datasource.url=jdbc:mariadb://localhost:3311/notenest?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=local-only

# 로컬 첫 기동 시 스키마 생성 + 세션 간 시드 데이터 유지 (Phase 1에서 DDL 스크립트 + validate로 전환 예정)
spring.jpa.hibernate.ddl-auto=update

# SQL 로그는 로컬에서만
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# 로컬 가짜 SMTP (docker-compose의 smtp4dev) — 수신 메일은 http://localhost:5001 에서 확인
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
