server.port=8086

spring.application.name=notenest-backend

# 로컬 실행이 기본 — DB 접속 정보는 application-local.properties 참고
spring.profiles.active=local

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# TODO(Phase 1): open-in-view=false 전환 + LazyInitialization 정리
spring.jpa.open-in-view=true

spring.main.allow-bean-definition-overriding=true
# TODO(Phase 1): 순환 참조 원인 제거 후 삭제
spring.main.allow-circular-references=true

# 기본값은 로컬 개발용. HS256 서명 키는 최소 32바이트 필요 (짧으면 UnsupportedKeyException으로 로그인 실패)
spring.jwt.secret=${JWT_SECRET:notenest-local-development-secret-key}

# iamport — 실제 값은 환경변수로 (README의 환경변수 표 참고)
imp.code=${IMP_CODE:}
imp.api.key=${IMP_API_KEY:}
imp.api.secretkey=${IMP_API_SECRET:}

# email
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false
spring.thymeleaf.order=0

## mail default settings
spring.mail.default-encoding=UTF-8
## mail custom settings — 실제 계정은 환경변수로
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.transport.protocol=smtp
