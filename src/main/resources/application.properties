server.port=8086

spring.application.name=notenest-backend

# 로컬 실행이 기본 — DB 접속 정보는 application-local.properties 참고
spring.profiles.active=local

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# 업로드 한도 — 전체 데모 최대 100MB(MediaAssetType.FULL_DEMO), 요청은 커버·미리듣기·JSON 여유를 더해 120MB.
# 자산 종류별 세부 상한(커버 10MB, 미리듣기 5MB)은 MediaUploadValidator 가 검사한다.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# 곡 미디어 객체 저장소(S3, private 버킷) — 자격증명은 설정 파일이 아니라 환경변수(AWS_ACCESS_KEY_ID 등)로만 주입한다.
notenest.storage.s3.bucket=${NOTENEST_S3_BUCKET:}
notenest.storage.s3.region=${AWS_REGION:ap-northeast-2}

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false
# 금액 등 정수 필드에 소수 JSON({"price":11000.9})이 오면 조용히 절삭하지 않고 거부한다(NB2 금액 계약).
spring.jackson.deserialization.accept-float-as-int=false

# TODO(Phase 1): open-in-view=false 전환 + LazyInitialization 정리
spring.jpa.open-in-view=true

spring.main.allow-bean-definition-overriding=true
# TODO(Phase 1): 순환 참조 원인 제거 후 삭제
spring.main.allow-circular-references=true

# 기본값은 로컬 개발용. HS256 서명 키는 최소 32바이트 필요 (짧으면 UnsupportedKeyException으로 로그인 실패)
spring.jwt.secret=${JWT_SECRET:notenest-local-development-secret-key}

# iamport — 실제 값은 환경변수로 (README의 환경변수 표 참고)
imp.code=${IMP_CODE:}
imp.api.key=${IMP_API_KEY:}
imp.api.secretkey=${IMP_API_SECRET:}

# email
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false
spring.thymeleaf.order=0

## mail default settings
spring.mail.default-encoding=UTF-8
## mail custom settings — 실제 계정은 환경변수로
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.transport.protocol=smtp
