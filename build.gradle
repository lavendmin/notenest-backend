plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.notenest'
version = '0.0.1-SNAPSHOT'

// 빌드·테스트·bootRun 을 JDK 17 로 고정한다 — PATH 의 java 버전(예: 21)과 무관하게 배포 대상 버전으로 재현한다.
// 로컬에 설치된 JDK 17 을 Gradle 이 자동 탐지한다(자동 다운로드 없음).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    //iamport 관련
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.projectlombok:lombok:1.18.28'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // QueryDSL — 동적 필터 목록 조회 DTO 프로젝션 (Spring Boot 3 / Jakarta)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.4'

    // NB1 — 곡 미디어 객체 저장소(S3). BOM 으로 SDK 모듈 버전을 맞추고 S3 모듈만 쓴다.
    // SDK 기본 HTTP 클라이언트(apache5·netty)는 제외하고 JDK 기반 url-connection-client 를 쓴다 —
    // apache5-client 가 요구하는 httpclient5 5.6.x 를 Spring Boot 3.2 의존성 관리가 5.2.3 으로 낮춰 런타임 불일치 위험이 있다.
    implementation platform('software.amazon.awssdk:bom:2.55.5')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    //iamport 관련
    implementation 'com.github.iamport:iamport-rest-client-java:0.2.23'

    // json파일 읽기
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // 이메일 관련
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

}

tasks.named('test') {
    useJUnitPlatform()
    // 계약 테스트가 현재(프로젝션 전) 필터 경로를 태우면 곡당 3MB LOB 엔티티가 로딩되어
    // 기본 테스트 힙(512m)을 넘긴다. 프로젝션 리팩터 후에는 가벼워지지만, before 상태
    // 특성화를 돌리기 위해 힙을 넉넉히 준다.
    maxHeapSize = '2g'
}

// NB5 검색 품질 평가 — 캡처한 검색 결과(run)를 qrels-v1 로 채점한다. 기본 test 와 별개로 수동 실행한다.
//   ./gradlew nb5Eval -Prun=docs/nb5/raw/phase1-like-results-eval-only.json -Plabel=phase1-like-eval-only
tasks.register('nb5Eval', JavaExec) {
    group = 'verification'
    description = 'NB5 검색 결과(run)를 qrels 로 채점해 nDCG@5·MRR@5 를 기록한다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.notenest.search.eval.SearchEvalCli'
    workingDir = projectDir
    args = [project.findProperty('run') ?: '', project.findProperty('label') ?: 'run']
    jvmArgs = ['-Dsun.stdout.encoding=UTF-8']
}
