plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.notenest'
version = '0.0.1-SNAPSHOT'

// 빌드·테스트·bootRun 을 JDK 17 로 고정한다 — PATH 의 java 버전(예: 21)과 무관하게 배포 대상 버전으로 재현한다.
// 로컬에 설치된 JDK 17 을 Gradle 이 자동 탐지한다(자동 다운로드 없음).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// NB5 — 테스트 전용 Testcontainers 만 Boot 관리 버전(1.19.7)보다 올린다. 1.19.7 의 docker-java 는 낮은 API 버전으로 요청해
// Docker Engine 29(최소 API 1.40)가 400 으로 거절한다. 1.21.4 는 API 버전을 협상한다. 운영 의존성에는 영향 없음.
ext['testcontainers.version'] = '1.21.4'

repositories {
    mavenCentral()
    //iamport 관련
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.projectlombok:lombok:1.18.28'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // QueryDSL — 동적 필터 목록 조회 DTO 프로젝션 (Spring Boot 3 / Jakarta)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // NB5 — 실제 Elasticsearch(+Nori) 통합 테스트는 매번 새 컨테이너를 띄운다(로컬 인덱스 상태에 의존하지 않음). 기본 test 에서는 제외.
    testImplementation 'org.testcontainers:junit-jupiter'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.4'

    // NB1 — 곡 미디어 객체 저장소(S3). BOM 으로 SDK 모듈 버전을 맞추고 S3 모듈만 쓴다.
    // SDK 기본 HTTP 클라이언트(apache5·netty)는 제외하고 JDK 기반 url-connection-client 를 쓴다 —
    // apache5-client 가 요구하는 httpclient5 5.6.x 를 Spring Boot 3.2 의존성 관리가 5.2.3 으로 낮춰 런타임 불일치 위험이 있다.
    implementation platform('software.amazon.awssdk:bom:2.55.5')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // NB5 — 검색 read model(Elasticsearch 8.11.1 + Nori). 버전은 Spring Boot 3.2 의존성 관리(Spring Data Elasticsearch 5.2.x)를 따른다.
    // 저장소 추상화(Repository)는 쓰지 않고 자동 구성된 ElasticsearchClient 로 색인·검색한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    //iamport 관련
    implementation 'com.github.iamport:iamport-rest-client-java:0.2.23'

    // json파일 읽기
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // 이메일 관련
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

}

tasks.named('test') {
    // NB5 — 실제 Elasticsearch 가 필요한 테스트(@Tag("es-integration"))는 기본 test 에서 빼고 nb5IntegrationTest 로 돌린다.
    useJUnitPlatform {
        excludeTags 'es-integration'
    }
    // NB5 테스트 격리 — 기본 test 는 Elasticsearch 를 쓰지 않는다. 주소를 명시하지 않은 테스트의 기동 부트스트랩·동기화가
    // 로컬 notenest-es(9201)에 문서를 쓰지 않도록 닫힌 포트로 고정한다(연결 거부 → 경고·503 경로). 주소를 직접 주는 테스트가 우선한다.
    environment 'NOTENEST_ES_URIS', 'http://127.0.0.1:1'
    // 계약 테스트가 현재(프로젝션 전) 필터 경로를 태우면 곡당 3MB LOB 엔티티가 로딩되어
    // 기본 테스트 힙(512m)을 넘긴다. 프로젝션 리팩터 후에는 가벼워지지만, before 상태
    // 특성화를 돌리기 위해 힙을 넉넉히 준다.
    maxHeapSize = '2g'
}

// NB5 검색 품질 평가 — 캡처한 검색 결과(run)를 qrels-v1 로 채점한다. 기본 test 와 별개로 수동 실행한다.
//   ./gradlew nb5Eval -Prun=docs/nb5/raw/phase1-like-results-eval-only.json -Plabel=phase1-like-eval-only
tasks.register('nb5Eval', JavaExec) {
    group = 'verification'
    description = 'NB5 검색 결과(run)를 qrels 로 채점해 nDCG@5·MRR@5 를 기록한다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.notenest.search.eval.SearchEvalCli'
    workingDir = projectDir
    args = [project.findProperty('run') ?: '', project.findProperty('label') ?: 'run']
    jvmArgs = ['-Dsun.stdout.encoding=UTF-8']
}

// NB5 — 실제 Elasticsearch 8.11.1 + Nori 통합 테스트. Testcontainers 가 docker/elasticsearch/Dockerfile 로 매번 새 컨테이너를 띄운다
// (개발자 로컬 인덱스·notenest-es 컨테이너 상태에 의존하지 않음). API 테스트는 기존 계약 테스트처럼 로컬 MariaDB(3311)의 전용 DB 를 쓴다.
//   ./gradlew nb5IntegrationTest
tasks.register('nb5IntegrationTest', Test) {
    group = 'verification'
    description = 'NB5 검색 — 실제 Elasticsearch(+Nori) 매핑·검색·품질 통합 테스트'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'es-integration'
    }
    maxHeapSize = '2g'
    // 컨테이너 정리용 Ryuk 이미지를 이 네트워크에서 받지 못한다(Docker Hub CDN 응답 EOF). Ryuk 대신 JVM 종료 훅이 컨테이너를 멈춘다
    // (ElasticsearchTestContainer). JVM 이 강제 종료되면 테스트 컨테이너가 남을 수 있다 — docker ps -a 로 확인해 지운다.
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
    shouldRunAfter tasks.named('test')
}
